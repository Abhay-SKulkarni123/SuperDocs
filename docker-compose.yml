services:
  postgres:
    image: postgres:16
    container_name: superdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: superdocs
      POSTGRES_USER: superdocs
      POSTGRES_PASSWORD: superdocs_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdocs -d superdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: